# ============================================================
# docker-compose.yml — orquesta varios contenedores como un sistema
# ============================================================
# Comandos clave:
#   docker compose up --build    construye y levanta todo
#   docker compose down          detiene y borra los contenedores (los datos quedan)
#   docker compose down -v       además borra el volumen (pierdes los datos)
#
# Las variables ${...} se leen de tu archivo .env (junto a este archivo).

services:

  # --- Base de datos PostgreSQL ---
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Volumen con nombre: los datos sobreviven aunque se borre el contenedor.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # La API solo arranca cuando Postgres responde de verdad.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Tu API FastAPI ---
  api:
    build: .            # construye la imagen con el Dockerfile de esta carpeta
    ports:
      - "8000:8000"     # puerto_de_tu_PC:puerto_del_contenedor
    environment:
      # "db" es el NOMBRE del servicio de arriba: Compose crea una red
      # interna donde cada servicio se encuentra por su nombre.
      # "+psycopg" indica el driver (psycopg 3) que usa SQLAlchemy.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
